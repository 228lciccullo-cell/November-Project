<!DOCTYPE html>
<html>
<head>
<title>Thanksgiving Dinner Generator</title>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanksgiving Dinner Generator</title>
	<link rel="stylesheet" href="style.css" />
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
  <body class="body">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <div class="website-layout">
    <div class="sidebar left-sidebar"></div>

    
    <div class="main-content">
        <div class="container text-center">
    <div class="meal-box">

        <div class="container text-center">

        <h1>Thanksgiving Dinner</h1>
        <p>Generate your own Thanksgiving dinner!</p>

        <div class="table-area">

            <div class="tablecloth">

                <div class="row align-items-center g-3">

                    <!-- Left side -->
                    <div class="col-6 col-md-4">
                        <div class="dish">
                            <strong>Side Dish</strong>
                            <p id="side1"></p>
                        </div>
                    </div>

                    <!-- Main course -->
                    <div class="col-6 col-md-4">
                        <div class="dish main-dish">
                            <strong>Main Course</strong>
                            <p id="main"></p>
                        </div>
                    </div>

                    <!-- Right side -->
                    <div class="col-6 col-md-4">
                        <div class="dish">
                            <strong>Side Dish</strong>
                            <p id="side2"></p>
                        </div>
                    </div>

                    <!-- Dessert -->
                    <div class="col-6 col-md-4">
                        <div class="dish">
                            <strong>Dessert</strong>
                            <p id="dessert"></p>
                        </div>
                    </div>

                    <!-- Drink -->
                    <div class="col-6 col-md-4">
                        <div class="dish drink">
                            <strong>Drink</strong>
                            <p id="drink"></p>
                        </div>
                    </div>

                    <!-- Third side -->
                    <div class="col-6 col-md-4">
                        <div class="dish">
                            <strong>Side Dish</strong>
                            <p id="side3"></p>
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <button class="btn btn-generate mt-4"
            onclick="makeMeal()">
            Generate New Meal
        </button>

    </div>
    </div>
</div>

    </div>

   
    <div class="sidebar right-sidebar"></div></div>


  <script src="script.js"></script>

    </body>
</html>
